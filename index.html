<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07100f"><meta name="description" content="ALGISK PRO secure sign in and account creation">
<title>ALGISK PRO — Welcome</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-shell">
<section class="auth-card">
<a class="brand" href="index.html" aria-label="ALGISK PRO home"><span class="brand-mark">A</span><span>ALGISK <b>PRO</b></span></a>
<div class="eyebrow">YOUR SPACE. YOUR CONTROL.</div>
<h1 id="formTitle">Welcome back<span>.</span></h1>
<p class="intro" id="formSubtitle">Sign in to continue to your workspace.</p>
<div class="tabs" role="tablist"><button class="tab active" id="loginTab" type="button">Sign in</button><button class="tab" id="signupTab" type="button">Create account</button></div>
<form id="authForm" novalidate>
<div class="form-field" id="nameField" hidden><label for="fullName">Full name</label><input id="fullName" type="text" placeholder="Your name" autocomplete="name" maxlength="60"></div>
<div class="form-field" id="usernameField" hidden><label for="username">Username</label><input id="username" type="text" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="24"></div>
<div class="form-field"><label for="identifier" id="identifierLabel">Email or username</label><input id="identifier" type="text" placeholder="you@example.com or username" autocomplete="username" required></div>
<div class="form-field"><div class="field-heading"><label for="password">Password</label><button class="text-button" type="button" id="forgotBtn">Forgot password?</button></div><div class="password-wrap"><input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password" required><button type="button" class="show-password" id="togglePassword" aria-label="Show password">Show</button></div></div>
<div class="form-field" id="confirmField" hidden><label for="confirmPassword">Confirm password</label><div class="password-wrap"><input id="confirmPassword" type="password" placeholder="Enter password again" autocomplete="new-password"><button type="button" class="show-password" data-toggle-password="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button></div></div>
<p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
<button class="primary-button" id="submitBtn" type="submit"><span id="submitText">Sign in</span><span class="button-arrow">→</span></button>
</form>
<div class="auth-foot"><span class="status-dot"></span> ALGISK PRO account access</div>
</section>
<aside class="auth-aside"><div class="aside-orb"></div><div class="aside-content"><span class="eyebrow">BUILT AROUND YOU</span><h2>One account.<br><span>More possibilities.</span></h2><p>A cleaner space to manage your profile, account preferences and personal workspace.</p><div class="aside-line"></div><small>ALGISK PRO <span>•</span> DIGITAL EXPERIENCE</small></div></aside>
</main>
<script src="script.js"></script>
</body></html>
