<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALGISK — Authentication</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card">
<header class="brand"><span class="logo"><i></i></span><span>ALGISK</span></header>
<h1 id="title">Sign in</h1><p id="subtitle">Welcome back. Use your email or username to continue.</p>
<form id="form" novalidate>
<div class="field usernameField"><label>Username</label><div class="input"><b>@</b><input id="username" placeholder="Choose a username" maxlength="24" autocomplete="username"><span class="check">✓</span></div><small id="usernameError"></small></div>
<div class="field"><div class="labelrow"><label id="idLabel">Email or username</label></div><div class="input"><b id="idIcon">@</b><input id="identifier" placeholder="you@studio.com or username" autocomplete="username"><span class="check">✓</span></div><small id="idError"></small></div>
<div class="field"><label>Password</label><div class="input"><b>♙</b><input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password"><button type="button" id="eye">◉</button><span class="check">✓</span></div>
<div class="password-actions"><button type="button" class="forgot" id="forgot">Forgot?</button></div>
<div class="strength" id="strength"><i></i><i></i><i></i><i></i><em></em></div><small id="passError"></small></div>
<div class="field confirmField"><label>Confirm password</label><div class="input"><b>♙</b><input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password"><span class="check">✓</span></div><small id="confirmError"></small></div>
<div class="runaway" id="runaway">
      <div class="destination" id="destination" aria-hidden="true">
        <span id="destinationText">Log in</span>
      </div>
      <svg class="tether-svg" aria-hidden="true">
        <line id="tetherLine" x1="50%" y1="50%" x2="50%" y2="50%"></line>
        <circle id="tetherAnchor" cx="50%" cy="50%" r="7"></circle>
        <circle id="tetherCore" cx="50%" cy="50%" r="2.5"></circle>
      </svg>
      <button id="submit" type="submit"><span id="btnText">Log in</span><i class="spinner"></i></button>
    </div>
<p class="hint" id="hint"><span></span> Complete the fields to unlock the button.</p><p class="keys"><kbd>Tab</kbd> reaches it. <kbd>Enter</kbd> submits.</p>
</form><div class="line"></div><p class="switch"><span id="switchText">No account yet?</span> <button type="button" id="switch">Create one</button></p>
</main><div id="toast"></div><script src="script.js"></script></body></html>
